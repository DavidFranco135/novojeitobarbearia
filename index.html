<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Novo Jeito | Gestão de Barbearia</title>

    <meta name="description" content="Sistema Premium de Gestão de Barbearia Novo Jeito">
    <!-- Cache bust: força o browser a buscar versão mais recente -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="/manifest.json">

    <!-- Favicon navegador (tab) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png">

    <!-- Apple / iOS (salvar na tela inicial) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Novo Jeito">

    <!-- Windows tiles -->
    <meta name="msapplication-TileImage" content="/icon-192.png">
    <meta name="msapplication-TileColor" content="#050505">

    <style>
      html, body, #root { background-color: #050505; min-height: 100vh; margin: 0; padding: 0; }

      /* Splash screen visível imediatamente — antes do React */
      #splash {
        position: fixed;
        inset: 0;
        background: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 20px;
      }
      #splash-name {
        color: #d4af37;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        font-family: Georgia, serif;
      }
      #splash-sub {
        color: #888;
        font-size: 13px;
        letter-spacing: 1px;
        font-family: sans-serif;
      }
      .splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Remove hash admin pages antes do React carregar para evitar tela preta -->
    <script>
      (function() {
        var adminPages = ['dashboard','agenda','clientes','servicos','financeiro','produtos','assinaturas','barbeiros','configuracoes','automacoes','inbox'];
        var hash = window.location.hash.replace('#','');
        if (adminPages.indexOf(hash) !== -1) {
          window.history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
          "recharts": "https://esm.sh/recharts@^3.7.0",
          "firebase/": "https://esm.sh/firebase@^12.9.0/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <!-- Splash screen: aparece imediatamente, some quando React monta -->
    <div id="splash">
      <img src="/logo.png" alt="Barbearia Novo Jeito" onerror="this.style.display='none'">
      <div id="splash-name">NOVO JEITO</div>
      <div id="splash-sub">Sistema de Barbearia</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- Remove o splash quando o React terminar de montar -->
    <script>
      (function() {
        var removed = false;
        function hideSplash() {
          if (removed) return;
          removed = true;
          var splash = document.getElementById('splash');
          if (!splash) return;
          splash.classList.add('hide');
          setTimeout(function() { splash.remove(); }, 500);
        }
        // Observa quando o #root recebe conteúdo (React montou)
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            hideSplash();
          }
        });
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        // Fallback: some depois de 5s no máximo
        setTimeout(hideSplash, 5000);
      })();
    </script>
  </body>
</html>
