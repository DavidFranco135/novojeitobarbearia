<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Novo Jeito | Gestão de Barbearia</title>

    <meta name="description" content="Sistema Premium de Gestão de Barbearia Novo Jeito">
    <!-- Cache bust: força o browser a buscar versão mais recente -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="/manifest.json">

    <!-- Favicon navegador (tab) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png">

    <!-- Apple / iOS (salvar na tela inicial) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Novo Jeito">

    <!-- Splash screen iOS — fundo preto para não piscar branco -->
    <style>
      html, body, #root { background-color: #050505; min-height: 100vh; }

      /* ── Animação de entrada (disco girando + explosão) ── */
      .nj-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.5rem;
        background: radial-gradient(circle at 50% 45%, #1a0f07 0%, #0a0604 55%, #050302 100%);
        transition: opacity 0.55s ease, visibility 0.55s;
        cursor: pointer;
      }
      .nj-splash.is-exit { opacity: 0; visibility: hidden; pointer-events: none; }
      .nj-stage {
        position: relative; width: 240px; height: 240px;
        transition: transform 0.55s cubic-bezier(0.22,1,0.36,1);
      }
      .nj-splash.is-exit .nj-stage { transform: scale(1.14); }
      @media (max-width: 380px) {
        .nj-stage { transform: scale(0.82); }
        .nj-splash.is-exit .nj-stage { transform: scale(0.95); }
      }
      /* camadas do anel */
      .nj-ring, .nj-spin, .nj-full, .nj-arc, .nj-solid, .nj-track, .nj-thin, .nj-halo {
        position: absolute; inset: 0; border-radius: 9999px;
      }
      .nj-ring { inset: 16px; }
      .nj-arc, .nj-solid, .nj-track, .nj-thin {
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 3.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 3.5px));
      }
      .nj-track { background: rgba(212,170,100,0.1); }
      .nj-thin {
        inset: -11px;
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1px));
        background: conic-gradient(rgba(212,170,100,0.5) 0 18%, transparent 18% 50%, rgba(212,170,100,0.28) 50% 60%, transparent 60%);
        will-change: transform;
      }
      .nj-arc {
        background: conic-gradient(
          transparent 0deg, transparent 70deg,
          rgba(140,90,30,0.15) 150deg, #a07030 250deg,
          #d4aa64 320deg, #f0d898 357deg, transparent 360deg
        );
      }
      .nj-glow { filter: blur(7px); opacity: 0.9; transform: scale(1.02); }
      .nj-spin { will-change: transform; }
      .nj-head {
        position: absolute; left: 50%; top: -1px;
        width: 9px; height: 9px; margin-left: -4.5px;
        border-radius: 9999px; background: #f5e8c0;
        box-shadow: 0 0 10px 4px rgba(212,170,100,0.9), 0 0 22px 7px rgba(212,170,100,0.45);
      }
      .nj-full { opacity: 0; will-change: opacity; }
      .nj-solid { background: conic-gradient(#f0d898, #d4aa64 25%, #a07030 50%, #d4aa64 75%, #f0d898); }
      .nj-wave {
        position: absolute; inset: 0; border-radius: 9999px;
        border: 3px solid #f0d898;
        box-shadow: 0 0 22px 5px rgba(212,170,100,0.55), inset 0 0 16px 2px rgba(212,170,100,0.5);
        opacity: 0; will-change: transform, opacity;
      }
      .nj-halo {
        inset: -28px;
        background: radial-gradient(circle, rgba(212,170,100,0.45) 0%, rgba(212,170,100,0.2) 35%, transparent 65%);
        opacity: 0; will-change: opacity, transform;
      }
      /* disco central */
      .nj-disc {
        position: absolute; left: 50%; top: 50%;
        width: 158px; height: 158px; margin: -79px 0 0 -79px;
        border-radius: 9999px;
        background: #000;
        box-shadow: 0 0 0 1px rgba(212,170,100,0.3), 0 0 55px -6px rgba(212,170,100,0.5);
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .nj-logo {
        width: 100%; height: 100%; object-fit: cover;
        opacity: 0; transition: opacity 0.4s ease;
      }
      .nj-logo.is-loaded { opacity: 1; }
      .nj-initial {
        font-family: Georgia, serif; font-size: 3.6rem;
        color: #d4aa64; text-align: center; line-height: 1;
        text-shadow: 0 0 20px rgba(212,170,100,0.6);
      }
      .nj-name {
        font-size: 10px; font-weight: 700; letter-spacing: 0.42em;
        text-transform: uppercase; color: #e8d4a0; padding-left: 0.42em;
        opacity: 0; will-change: opacity, transform;
      }
      /* faíscas */
      .nj-spark {
        position: absolute; left: 50%; top: 50%;
        width: var(--s); height: var(--s);
        margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
        border-radius: 9999px; background: #f5e8c0;
        box-shadow: 0 0 7px 2px rgba(212,170,100,0.85);
        opacity: 0;
      }

      /* ── Animações ── */
      .nj-splash.is-intro .nj-spin  { animation: nj-spin-in 2.5s cubic-bezier(0.5,0,0.3,1) both, nj-fade-out 0.28s ease 2.46s both; }
      .nj-splash.is-intro .nj-full  { animation: nj-full 1s ease 2.46s both; }
      .nj-splash.is-intro .nj-halo  { animation: nj-flash 1s ease-out 2.49s both; }
      .nj-splash.is-intro .nj-wave  { animation: nj-wave 0.9s cubic-bezier(0.15,0.6,0.3,1) 2.52s both; }
      .nj-splash.is-intro .nj-wave-2 { animation-delay: 2.66s; }
      .nj-splash.is-intro .nj-ring  { animation: nj-shake 0.38s ease-out 2.51s both; }
      .nj-splash.is-intro .nj-disc  { animation: nj-disc 0.75s cubic-bezier(0.22,1,0.36,1) 0.65s both; }
      .nj-splash.is-intro .nj-name  { animation: nj-name 0.75s ease 2.34s both; }
      .nj-spark { animation: nj-spark 0.95s cubic-bezier(0.15,0.7,0.3,1) both; }
      .nj-thin  { animation: nj-rev 3s linear infinite; }
      .nj-splash.is-loader .nj-spin { animation: nj-loop 1s linear infinite; }

      @keyframes nj-spin-in { from { transform: rotate(-90deg); } to { transform: rotate(990deg); } }
      @keyframes nj-full    { 0%{opacity:0;transform:scale(1)} 20%{opacity:1;transform:scale(1.06)} 100%{opacity:1;transform:scale(1)} }
      @keyframes nj-wave    { 0%{opacity:0.9;transform:scale(1)} 100%{opacity:0;transform:scale(2.2)} }
      @keyframes nj-shake   { 0%{transform:scale(1)} 30%{transform:scale(1.04)} 100%{transform:scale(1)} }
      @keyframes nj-loop    { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes nj-rev     { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
      @keyframes nj-fade-out{ from{opacity:1} to{opacity:0} }
      @keyframes nj-flash   { 0%{opacity:0;transform:scale(0.8)} 22%{opacity:1;transform:scale(1.3)} 100%{opacity:0;transform:scale(2)} }
      @keyframes nj-disc    { from{opacity:0;transform:scale(0.6)} to{opacity:1;transform:scale(1)} }
      @keyframes nj-name    { from{opacity:0;transform:translateY(8px)} to{opacity:0.9;transform:translateY(0)} }
      @keyframes nj-spark   {
        0%   { opacity:0; transform:rotate(var(--a)) translateY(-108px) scale(1.4); }
        12%  { opacity:1; }
        100% { opacity:0; transform:rotate(var(--a)) translateY(calc(-108px - var(--d))) scale(0.2); }
      }
    </style>

    <!-- Windows tiles -->
    <meta name="msapplication-TileImage" content="/icon-192.png">
    <meta name="msapplication-TileColor" content="#050505">

    <!-- Redireciona pages.dev para domínio oficial -->
    <script>
      (function() {
        if (window.location.hostname === 'novojeitobarbearia.pages.dev') {
          window.location.replace('https://novojeitobarbearia.com.br' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Remove hash admin pages antes do React carregar para evitar tela preta -->
    <script>
      (function() {
        var adminPages = ['dashboard','agenda','clientes','servicos','financeiro','produtos','assinaturas','barbeiros','configuracoes','automacoes','inbox'];
        var hash = window.location.hash.replace('#','');
        if (adminPages.indexOf(hash) !== -1) {
          // Remove o hash — o React vai abrir a página pública por padrão
          window.history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
          "recharts": "https://esm.sh/recharts@^3.7.0",
          "firebase/": "https://esm.sh/firebase@^12.9.0/"
        }
      }
    </script>
    <!-- Preload das imagens estáticas — carrega em paralelo com o JS -->
    <link rel="preload" as="image" href="/logo.png">
    <link rel="preload" as="image" href="/cover.jpg">
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>

    <!-- ── Animação de entrada ── -->
    <div class="nj-splash is-intro" id="nj-splash">
      <div class="nj-stage">
        <!-- anel de fundo -->
        <div class="nj-ring">
          <div class="nj-track"></div>
          <div class="nj-thin"></div>
        </div>
        <!-- cometa girando -->
        <div class="nj-spin">
          <div class="nj-arc nj-glow"></div>
          <div class="nj-arc"></div>
          <div class="nj-head"></div>
        </div>
        <!-- anel completo que acende na explosão -->
        <div class="nj-full nj-solid"></div>
        <!-- ondas de expansão -->
        <div class="nj-wave"></div>
        <div class="nj-wave nj-wave-2"></div>
        <!-- halo de luz -->
        <div class="nj-halo"></div>
        <!-- disco central com logo -->
        <div class="nj-disc">
          <img class="nj-logo" id="nj-logo"
               src="/logo.png"
               alt="Novo Jeito" />
          <span class="nj-initial" id="nj-initial">NJ</span>
        </div>
        <!-- faíscas da explosão (8 direções) -->
        <div class="nj-spark" style="--a:0deg;   --d:28px; --s:7px; animation-delay:2.52s"></div>
        <div class="nj-spark" style="--a:45deg;  --d:22px; --s:5px; animation-delay:2.56s"></div>
        <div class="nj-spark" style="--a:90deg;  --d:30px; --s:8px; animation-delay:2.50s"></div>
        <div class="nj-spark" style="--a:135deg; --d:20px; --s:5px; animation-delay:2.58s"></div>
        <div class="nj-spark" style="--a:180deg; --d:26px; --s:6px; animation-delay:2.53s"></div>
        <div class="nj-spark" style="--a:225deg; --d:24px; --s:5px; animation-delay:2.57s"></div>
        <div class="nj-spark" style="--a:270deg; --d:28px; --s:7px; animation-delay:2.51s"></div>
        <div class="nj-spark" style="--a:315deg; --d:21px; --s:4px; animation-delay:2.55s"></div>
      </div>
      <div class="nj-name">NOVO JEITO</div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('nj-splash');
        var logo   = document.getElementById('nj-logo');
        var initial = document.getElementById('nj-initial');
        var dismissed = false;
        var appReady = false;
        var introEnded = false;

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          splash.classList.add('is-exit');
          setTimeout(function () { splash && splash.remove(); }, 650);
        }

        // Entra no modo spinner contínuo após a intro terminar
        function enterLoader() {
          introEnded = true;
          splash.classList.remove('is-intro');
          splash.classList.add('is-loader');
          // Se o React já avisou que está pronto, fecha imediatamente
          if (appReady) dismiss();
        }

        // React chama window.appReady() quando o conteúdo estiver pronto
        window.appReady = function () {
          appReady = true;
          // Se a intro já acabou, fecha agora; senão espera a intro
          if (introEnded) dismiss();
        };

        // Logo local carrega rápido
        logo.addEventListener('load', function () {
          logo.classList.add('is-loaded');
          if (initial) initial.style.display = 'none';
        });

        // Intro dura ~3.6s — depois vira spinner até o React avisar
        setTimeout(enterLoader, 3650);

        // Segurança: fecha em 8s mesmo que o React não avise
        setTimeout(dismiss, 8000);

        // Clique/toque fecha imediatamente
        splash.addEventListener('click', dismiss);
        splash.addEventListener('touchstart', dismiss, { passive: true });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
